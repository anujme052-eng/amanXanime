name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Capacitor assets
        run: |
          mkdir -p dist android/app/src/main/assets
          echo '<!doctype html><html><body>Opening app...</body></html>' > dist/index.html

      - name: Build Android APK
        run: |
          sed -i "s/versionCode 1/versionCode $GITHUB_RUN_NUMBER/" android/app/build.gradle
          sed -i "s/versionName "1.0"/versionName "1.0.$GITHUB_RUN_NUMBER"/" android/app/build.gradle
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jio-VidStream-Hub-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
